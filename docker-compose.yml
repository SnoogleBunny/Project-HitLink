services:
  postgres:
    image: postgres:16-alpine
    container_name: flowstate-postgres
    environment:
      POSTGRES_DB: flowstate_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flowstate-postgres-data:/var/lib/postgresql/data

volumes:
  flowstate-postgres-data:
