services:
  postgres:
    image: postgres:16-alpine
    container_name: hitlink-postgres
    environment:
      POSTGRES_DB: hitlink_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hitlink-postgres-data:/var/lib/postgresql/data

volumes:
  hitlink-postgres-data:
