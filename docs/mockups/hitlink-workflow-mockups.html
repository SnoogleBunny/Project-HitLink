const legalContent = {"draft":true,"draftNotice":"Draft for review. These pages are part of the HitLink mockup and are not the published terms or privacy policy. Bracketed details require confirmation before launch.","effectiveDate":"[EFFECTIVE DATE]","terms":{"title":"Terms of Service","description":"How HitLink accounts, gym workspaces, bookings and adult coaching records may be used.","sections":[{"title":"Who provides HitLink","paragraphs":["HitLink is software operated by [LEGAL BUSINESS NAME], at [BUSINESS CONTACT ADDRESS] (\"HitLink\", \"we\" or \"us\"). These terms govern access to our software by workspace customers, staff, members, guardians and adult coaching clients.","A gym or coach using HitLink supplies their own classes, memberships and coaching. Their service agreement, cancellation rules and participation forms apply separately. These terms do not replace those agreements or make HitLink the provider of that training."]},{"title":"Accounts and authority","paragraphs":["Provide accurate account details, keep your sign-in credentials private and tell us promptly about suspected unauthorised access at [PUBLIC SUPPORT EMAIL]. Use only the records and workspaces you have permission to access.","If you open or manage a workspace for a business, you must have authority to act for it. Account holders must be able to enter the relevant agreement. [CONFIRM ACCOUNT ELIGIBILITY RULES]. Workspace owners must assign appropriate staff permissions and remove access when it is no longer needed."]},{"title":"Members, guardians and children","paragraphs":["You may act for another person only within the authority you have and the permissions confirmed by the gym. A family relationship or responsibility for payment does not automatically grant access to every record.","A verified guardian may manage the child's permitted bookings and forms. Keep the selected participant accurate when booking, signing or cancelling. The gym must confirm who may consent for a child and review access when circumstances change. HitLink's one-to-one coaching workflow is for adult clients."]},{"title":"Bookings and provider rules","paragraphs":["Your gym or coach sets class eligibility, capacity, allowances, booking deadlines, attendance rules and cancellation terms. Review the rules shown for the named participant before confirming a booking or purchase.","A request is confirmed only when the service shows a confirmation. Report a booking or allowance error to the provider. Attendance records, forms and payment records must be kept accurate; using HitLink does not excuse the provider from correcting an error."]},{"title":"Coaching and participation","paragraphs":["HitLink stores schedules, programs and coach-authored notes. These features support training administration and do not provide medical diagnosis, treatment or emergency monitoring.","Discuss training suitability, injuries and changes to your circumstances with the provider and, when needed, a qualified health professional. The provider remains responsible for the training they deliver and for explaining their participation requirements. Any waiver must be presented and accepted separately."]},{"title":"Charges and refunds","paragraphs":["HitLink software fees are payable by the customer named in the software order. The price, currency, applicable taxes, billing interval, renewal terms and cancellation method must be shown in that order or checkout before agreement. [CONFIRM HITLINK SUBSCRIPTION AND REFUND TERMS].","Gym membership, class and coaching charges are separate and are set by the provider. Direct questions about those charges and refunds to that provider. Contact [PUBLIC SUPPORT EMAIL] about a HitLink software charge, billing error or refund request. Any refund or cancellation rights required by law continue to apply."]},{"title":"Cancelling a booking, membership or account","paragraphs":["Use the cancellation method given for the service you are cancelling and check the result. Cancelling one booking does not cancel a membership or software subscription.","Closing a HitLink sign-in account does not, by itself, cancel a separate agreement with a gym or coach. The provider must explain how to cancel that agreement. These terms do not limit a cancellation method or remedy available under applicable law."]},{"title":"Responsible use","paragraphs":["Do not access another person's records without authority, impersonate a member or guardian, falsify attendance or consent, upload material you have no right to use, or use HitLink to harass or discriminate unlawfully.","Do not attempt to bypass permissions, disrupt the service, introduce malicious code or extract other users' information. Tell [PUBLIC SUPPORT EMAIL] if you find a security issue."]},{"title":"Your records and HitLink's software","paragraphs":["You retain the rights you already have in material you provide. You give HitLink the permission needed to store, process and display that material to deliver the agreed service, subject to the Privacy Policy. Personal information remains subject to the rights of the people it concerns.","HitLink and its licensors retain their rights in the software, branding and other materials they provide. You may use them through the service within your authorised access. This does not transfer ownership of the software."]},{"title":"Workspace data and coaching notes","paragraphs":["A workspace customer must have authority to enter or import records, give people the required notices, and keep information relevant to the service. This includes member lists, guardian links, billing records, waiver documents and coaching notes.","Client-shared coaching notes are available to the client and authorised coaching staff. Private coach notes stay outside the client's ordinary view and are restricted to authorised coaching staff. Front-desk access or household payment responsibility does not grant access to private coaching notes. A private label does not override a lawful access request."]},{"title":"Availability and changes to the service","paragraphs":["Maintenance, faults or events outside our control may interrupt HitLink. We do not promise uninterrupted access, a particular training outcome or that every feature will remain unchanged.","We will explain material changes affecting a paid subscription and any available options under the agreed order and applicable law. [CONFIRM SERVICE NOTICE PROCESS]. Providers should keep a workable way to manage time-sensitive attendance, cancellations and participant safety during an outage."]},{"title":"Suspension, ending service and records","paragraphs":["We may restrict access when reasonably needed to address misuse, a security issue, unlawful activity or an unpaid software account. Where practical, we will explain the reason and how to resolve it. A workspace owner may also remove staff access within their authority.","A customer may end its HitLink subscription under the agreed order. Before access ends, contact [PUBLIC SUPPORT EMAIL] about the available export process. [CONFIRM EXPORT FORMAT, REQUEST WINDOW AND POST-CLOSURE PROCESS]. Ending access does not itself erase records that must still be retained, and retention remains subject to the Privacy Policy."]},{"title":"Responsibility and legal rights","paragraphs":["Each party remains responsible for its own obligations under these terms and applicable law. A gym or coach remains responsible for its services, staff and decisions; HitLink remains responsible for its software obligations.","Nothing in these terms removes a consumer protection, privacy right or remedy that cannot lawfully be excluded. [APPROVED LIABILITY TERMS]. Any agreed limitation must be clear about its scope and preserve liabilities and rights that applicable law does not permit the parties to limit."]},{"title":"Changes, disputes and contact","paragraphs":["We will identify the effective date of an updated version and give notice of material changes before they apply where required. A new use of personal information may also need a separate privacy notice or consent. [CONFIRM TERMS NOTICE AND ACCEPTANCE PROCESS].","Contact [PUBLIC SUPPORT EMAIL] about the service or these terms. The intended governing law and court location are [GOVERNING LAW AND COURT LOCATION], subject to any mandatory rights that apply to you."]}]},"privacy":{"title":"Privacy Policy","description":"What HitLink handles, why it is needed, who can access it and how to raise a privacy request.","sections":[{"title":"Who is responsible","paragraphs":["HitLink is operated by [LEGAL BUSINESS NAME]. Our privacy contact is [PRIVACY CONTACT NAME OR ROLE], reachable at [PUBLIC PRIVACY EMAIL] or [BUSINESS CONTACT ADDRESS].","We handle account and service-administration information for our own operations. Gyms and coaches decide what member and client records they need for their services; HitLink handles those records on their behalf as agreed with them. The provider's own privacy notice should explain those decisions. This division of work does not remove either organisation's responsibilities under applicable law."]},{"title":"Account and workspace information","paragraphs":["Depending on how you use HitLink, we handle your name, email address, account credentials, account role, gym or coaching business details, contact information and workspace settings.","We use this information to create accounts, identify the correct workspace, manage permissions, administer the software subscription and respond to service requests."]},{"title":"Member, booking and payment records","paragraphs":["A provider may enter or import a member's name, contact details, date of birth, status, tags, relevant notes, guardian contact details and confirmed family links. Records may also include memberships, class bookings, attendance, billing history and payment status.","These records support eligibility checks, booking and attendance, membership allowances, billing and authorised guardian actions. An imported member list may also remain in the source file and import records until it is removed under the applicable retention process."]},{"title":"Forms and coaching information","paragraphs":["A provider may store forms and waiver documents. A signing record may include the typed name, email address, signing time, IP address and browser details, so the provider can identify the document and record of acceptance.","Adult coaching records may include a program, training activities and coach-authored daily notes. Notes can reveal sensitive information. Providers should collect only what is needed for the agreed training purpose and explain any sensitive collection when it occurs."]},{"title":"Who can see records","paragraphs":["Members see the records made available to their own account. A guardian sees only the people and actions for which authority and access have been confirmed. Paying for another person's service does not give access to that person's private coaching notes.","Client-shared coaching notes are visible to the client and authorised coaching staff. Private coach notes are restricted to authorised coaching staff and are not included in the client's ordinary view. A private label does not determine the outcome of a legal access request.","HitLink personnel and service providers may need limited access to run the service, resolve an issue or meet a legal obligation. [CONFIRM SUPPORT ACCESS CONTROLS AND PROVIDER ACCESS]."]},{"title":"Service providers and other disclosures","paragraphs":["Some functions may require providers that process information for HitLink, such as hosting, file storage, payment processing and service email. [APPROVED PROVIDERS, THEIR FUNCTIONS AND INFORMATION SHARED]. Payment processing: [CONFIRM STRIPE'S PRODUCTION ROLE AND PRIVACY NOTICE].","We may disclose information when required or permitted by applicable law, including to respond to a valid legal demand or a serious safety issue. Any disclosure must have an appropriate basis and be limited to what the circumstances require.","[CONFIRM ANY OPTIONAL ANALYTICS, MARKETING, SALE OR OTHER INDEPENDENT DATA SHARING]. This draft does not establish an approved purpose for any of those activities."]},{"title":"Consent and choices","paragraphs":["We explain the information needed for a feature when you provide it. Sensitive or unexpected uses need an appropriate, clear choice. Optional uses must be distinguishable from what is needed to deliver the service.","You can contact the responsible provider or [PUBLIC PRIVACY EMAIL] to ask about withdrawing consent. We will explain the effect on the service and any lawful limits before acting on the request. Agreeing to the Terms of Service is not blanket consent to unrelated uses of personal information."]},{"title":"Cookies and browser storage","paragraphs":["HitLink uses sign-in cookies to maintain authenticated access. [CONFIRM COOKIE AND BROWSER-STORAGE INVENTORY, PURPOSES AND DURATIONS]. Blocking necessary cookies may prevent sign-in or other requested features from working.","Any optional analytics or marketing technology must be identified separately, with the applicable consent choice and a way to change it. [CONFIRM WHETHER OPTIONAL TECHNOLOGIES ARE USED AND HOW CHOICES ARE MANAGED]."]},{"title":"Children and guardian access","paragraphs":["Children may have gym member records managed through authorised adults. The provider must assess who can meaningfully consent and who has authority to act for the child, taking account of the child's understanding and applicable law.","Guardian access must match that authority and the purpose of the request. A shared household or payer account is not enough on its own. The one-to-one coaching workflow described here is for adults."]},{"title":"Where information is processed","paragraphs":["[CONFIRMED PROCESSING AND STORAGE COUNTRIES, INCLUDING PROVIDER SUPPORT ACCESS]. The production locations have not yet been confirmed for this draft.","Where information is processed outside Canada, the laws of that location may allow courts or public authorities to access it. The published policy must explain the actual arrangements and the protections used for service-provider processing."]},{"title":"Protection and retention","paragraphs":["We are responsible for reasonable safeguards suited to the sensitivity of the information we handle. [CONFIRMED ADMINISTRATIVE, TECHNICAL AND PHYSICAL SAFEGUARDS]. No method of storage or transmission can promise complete security.","Retention depends on why a record is needed, whether the service is active, legal recordkeeping duties and unresolved disputes. Records used for decisions affecting a person may have a required minimum retention period. After the applicable purposes and obligations end, information should be securely deleted or made no longer identifiable.","[APPROVED RETENTION SCHEDULE, INCLUDING IMPORT FILES, WAIVERS, COACHING NOTES, LOGS AND BACKUPS]. Account closure does not promise immediate deletion of every copy."]},{"title":"Access, correction and deletion requests","paragraphs":["Contact [PUBLIC PRIVACY EMAIL] to request access to your personal information, ask how it has been used or shared, request correction, or ask for deletion. For a gym or coaching record, you may also contact that provider. We will help identify who is responsible for responding.","We may need to verify your identity and authority without collecting more than necessary. Requests are subject to applicable law, including limits protecting other people's information and required retention. We will explain an applicable limit or refusal and how to raise a concern. A deletion request is not a promise that every record can be erased."]},{"title":"Concerns and policy changes","paragraphs":["Send a privacy concern to [PUBLIC PRIVACY EMAIL], addressed to [PRIVACY CONTACT NAME OR ROLE]. Describe the record or practice involved without sending unnecessary sensitive information.","You may also contact the privacy regulator with jurisdiction over your concern, which may be the Office of the Information and Privacy Commissioner for British Columbia or the Office of the Privacy Commissioner of Canada.","The effective date identifies the current version. We will explain material changes and obtain fresh consent where required before introducing a new use or disclosure. [CONFIRM PRIVACY NOTICE PROCESS]."]}]},"businessPlaceholders":["[LEGAL BUSINESS NAME]","[BUSINESS CONTACT ADDRESS]","[PUBLIC SUPPORT EMAIL]","[PUBLIC PRIVACY EMAIL]","[PRIVACY CONTACT NAME OR ROLE]","[EFFECTIVE DATE]","[GOVERNING LAW AND COURT LOCATION]","[CONFIRM ACCOUNT ELIGIBILITY RULES]","[CONFIRM HITLINK SUBSCRIPTION AND REFUND TERMS]","[APPROVED LIABILITY TERMS]","[APPROVED PROVIDERS, THEIR FUNCTIONS AND INFORMATION SHARED]","[CONFIRM STRIPE'S PRODUCTION ROLE AND PRIVACY NOTICE]","[CONFIRMED PROCESSING AND STORAGE COUNTRIES, INCLUDING PROVIDER SUPPORT ACCESS]","[APPROVED RETENTION SCHEDULE, INCLUDING IMPORT FILES, WAIVERS, COACHING NOTES, LOGS AND BACKUPS]","[CONFIRMED ADMINISTRATIVE, TECHNICAL AND PHYSICAL SAFEGUARDS]","[CONFIRM EXPORT FORMAT, REQUEST WINDOW AND POST-CLOSURE PROCESS]","[CONFIRM SUPPORT ACCESS CONTROLS AND PROVIDER ACCESS]","[CONFIRM COOKIE AND BROWSER-STORAGE INVENTORY, PURPOSES AND DURATIONS]","[CONFIRM WHETHER OPTIONAL TECHNOLOGIES ARE USED AND HOW CHOICES ARE MANAGED]","[CONFIRM ANY OPTIONAL ANALYTICS, MARKETING, SALE OR OTHER INDEPENDENT DATA SHARING]","[CONFIRM SERVICE NOTICE PROCESS]","[CONFIRM TERMS NOTICE AND ACCEPTANCE PROCESS]","[CONFIRM PRIVACY NOTICE PROCESS]"],"sources":[{"title":"B.C. Personal Information Protection Act","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/03063_01","accessedDate":"2026-10-11","note":"Primary statute reviewed for access and correction (sections 23–24), reasonable safeguards (section 34), and retention (section 35). The draft preserves legal limits and leaves operational periods to the confirmed retention schedule."},{"title":"Joint guidance on obtaining meaningful consent","url":"https://www.priv.gc.ca/en/privacy-topics/privacy-for-businesses/appropriate-handling-of-personal-information/collecting-personal-information-and-consent/consent/gl_omc_201805/","accessedDate":"2026-10-11","note":"Canadian, B.C. and Alberta regulators' guidance on clear purposes, sensitive information, optional choices, changing practices and children. B.C. guidance considers capacity rather than imposing a universal consent age."},{"title":"OPC guidelines for processing personal data across borders","url":"https://www.priv.gc.ca/en/privacy-topics/airports-and-borders/gl_dab_090127/","accessedDate":"2026-10-11","note":"Supports checking provider contracts, accountability and disclosure of foreign processing. Does not establish where HitLink data is or will be stored."},{"title":"Provincial laws that may apply instead of PIPEDA","url":"https://www.priv.gc.ca/en/privacy-topics/privacy-laws-in-canada/the-personal-information-protection-and-electronic-documents-act-pipeda/r_o_p/prov-pipeda/","accessedDate":"2026-10-11","note":"Explains that applicable privacy law depends on the activity and that provincial and federal law can both apply. The drafts do not assert exclusive B.C. jurisdiction or certified compliance."},{"title":"B.C. Business Practices and Consumer Protection Act","url":"https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/04002_00_multi","accessedDate":"2026-10-11","note":"Primary statute reviewed to preserve mandatory consumer rights. Software subscription terms and each provider's consumer contracts still require review against the rules applicable at launch."}]};

// One interruptible animation owner per element. Values and actions settle
// synchronously; motion only explains the already-applied result.
const motionJobs=new WeakMap();
const motionEase='cubic-bezier(0.22,0.68,0.3,1)';
function animateElement(element,frames,duration=200,name='feedback',easing=motionEase){
 if(!element)return null;
 motionJobs.get(element)?.cancel();
 if(motionPreference.matches||document.hidden||!element.animate)return null;
 const job=element.animate(frames,{duration,easing});job.id='hl-'+name;
 motionJobs.set(element,job);
 job.finished.then(()=>{if(motionJobs.get(element)===job)motionJobs.delete(element);},()=>{if(motionJobs.get(element)===job)motionJobs.delete(element);});
 return job;
}
function finishMotion(job,done){if(job)job.finished.then(done,done);else done();}
function cancelMotionWithin(element){element?.getAnimations({subtree:true}).forEach(job=>job.cancel());}
motionPreference.addEventListener('change',event=>{if(event.matches)cancelMotionWithin(root);});
document.addEventListener('visibilitychange',()=>{root.dataset.motionPaused=String(document.hidden);if(document.hidden)cancelMotionWithin(root);});

function rememberFocus(element){
 if(!element||!root.contains(element))return null;

  const attrs=`data-class="${item.id}" data-day="${day}"`,description=esc(item.title+' · '+demoDayLabel(day)+' · '+demoClassRange(item));
  let action;

 }).join('');

function commitBooking(pack=false,profile=memberState.profile,selection=bookingSelection){
 if(!memberClassAvailable(selection))return;
 memberState.profile=profile;
 if(profile==='child'){memberState.childBooked=true;memberState.childBookingDate=selection.day;memberState.childAttended=false;}
 else{memberState.booked=true;memberState.funding=pack?'pack':'membership';memberState.bookingDate=selection.day;memberState.bookingClassId=selection.classId;memberState.attended=false;}
 if(memberState.pendingOperation?.profile===profile){memberState.bookingPending=false;memberState.pendingOperation=null;}
 closeDialog();showMemberClass(selection);toast(`Confirmed for ${memberName()}. ${pack?'One punch reserved.':memberHasLimits()?'One class from your allowance reserved.':'Your place is reserved under your unlimited membership.'}`);
}

 `},
 'c-sessions': {title:'Appointments & recovery',subtitle:'Manage appointment times, credits and disputed outcomes.',icon:'calendar',navLabel:'Appointments',group:'Coaching',html:()=>`
  ${coachingWorkspace('c-sessions')}${coachingState.notesOnly?'':coachingUnits()}
  ${coachingState.notesOnly?notice('No appointments included','This program includes weekday notes only. It has no appointment credits and requires no discovery call or session purchase.'):section('Scheduled delivery',table(['Appointment','Outcome','Credit used or returned','Action'],[['Oct 6 · 17:00 PDT','Completed','1 credit used · recorded once',act('View receipt','c-session-receipt')],['Oct 8 · 17:00 PDT',badge(coachingState.past,coachingState.past==='disputed'?'warning':'neutral'),['review','disputed'].includes(coachingState.past)?'1 credit held during review':coachingState.past==='no-show'?'1 credit used under the accepted policy':'Released / corrected',act('Review outcome','c-past-review')],[`${coachingDate(coachingState.session.date)} · ${coachingState.session.time} PDT`,badge(coachingState.session.status,coachingState.session.status==='confirmed'?'success':'neutral'),coachingState.session.status==='confirmed'?'1 credit reserved · not yet used':'No active reservation',coachingState.session.status==='confirmed'?'<div class="hl-row">'+act('Reschedule','c-reschedule')+act('Cancel','c-cancel')+'</div>':go('Find a time','p-session')]]))}
  <div class="hl-grid">${section('Accepted appointment terms',`<p><strong>Policy v1 · 24-hour cutoff · 10-minute no-show grace</strong></p><p>Changes made before the cutoff move or return the same reserved credit. A late move uses the original credit and needs another available credit unless an authorized waiver applies. If the move fails, the original booking stays confirmed.</p><p>Provider cancellation returns the credit. Coach absence, technical problems and disputed outcomes require review. Time passing alone does not prove a no-show.</p>${go('Client appointment view','p-session')}`)}${section('Availability & payment',`<p>Availability checks include coach hours, leave, time between appointments, rooms and martial arts classes. An overlapping coach booking cannot be overridden.</p><p>Program payment is <strong>${esc(coachingState.payment)}</strong>. For a paid future-start program, you can book ahead for eligible dates within the program. Pending payment provides no appointment credits.</p>${notice('Cannot arrange the service?','Alex Morgan will respond within 2 business days with booking options, a proposed extension or a program-fee review.')}${act('Open refund review','c-refund')}`)}</div>
 `},
 'c-continuity': {title:'Pause & coach continuity',subtitle:'Propose a pause or coach change for Maya to review.',icon:'refresh-cw',navLabel:'Pause & handoff',group:'Coaching',html:()=>`
  ${coachingWorkspace('c-continuity',true)}<div class="hl-grid">${section('Program pause dates',`<p>Maya reviews the pause dates and revised end date before accepting.</p><div class="hl-grid">${field('First paused date','<input id="c-pause-start" class="hl-input" type="date" value="2026-10-12" min="2026-10-09">')}${field('Last paused date','<input id="c-pause-end" class="hl-input" type="date" value="2026-10-16" min="2026-10-09">')}</div>${notice('How the pause changes the plan','Extend the program by the number of paused delivery days. Cancel appointments during the pause and return their reserved credits. Old reminders and cancelled bookings are not restored.')}<div class="hl-row">${act('Preview pause','c-pause-preview','primary')}${coachingState.pause?act('Review return plan','c-resume'):''}</div>${coachingState.pause?`<p class="hl-small">Accepted pause: ${coachingDate(coachingState.pause.start)}–${coachingDate(coachingState.pause.end)}. Revised end: ${coachingDate(coachingState.end)}.</p>`:''}`)}
  ${section('Coach assignment',`<div class="hl-list-row">${person(coachingState.coach,'Accepted assignment · Maya Chen',coachingState.coach==='Jordan Lee'?'JL':'TP')}${badge(coachingState.status==='awaiting-replacement'?'Access revoked':'Assigned',coachingState.status==='awaiting-replacement'?'danger':'success')}</div><p>Recording an immediate departure removes the outgoing coach’s access and pauses their note delivery. Staff receive a task to arrange the next steps.</p><div class="hl-row">${act('Record coach departure','c-depart','danger')}${act('Propose Taylor Park','c-replacement')}</div>${coachingState.replacement?notice('Maya’s acceptance required','Taylor receives no restricted records until Maya accepts the assignment and chooses whether to share published history. Private notes and unpublished drafts never transfer.','warning')+go('View Maya’s decision','p-program'):''}<p class="hl-muted hl-small">Alex Morgan handles the coach change. Staff receive only the status, deadlines and appointment details.</p>`)} </div>
  ${section('What a handoff can include',table(['Record','Replacement coach','Owner / reception'],[['Accepted program and shared goals','Only after client-approved assignment','Status only'],['Published daily notes and summaries','Only the published history Maya agreed to share','Delivery status only'],['Unpublished daily-note draft','Never transferred','No access'],['Private working note','Author only, while assigned to the client','No standard access'],['Appointment and payment record','Records for the assigned service','Booking and payment details allowed by their role']]))}${coachingScope()}
 `},
 'c-close': {title:'End review & records',subtitle:'Review remaining service, refunds and client records.',icon:'archive',navLabel:'Closure & export',group:'Coaching',html:()=>`
  ${coachingWorkspace('c-close',true)}<div class="hl-grid-3">${metric(coachingDate(coachingState.end),'Planned final delivery date','Final promised note remains included')}${metric(coachingState.settlement,'Settlement','Service can close while money is pending')}${metric(coachingState.exportStatus,'Client export','Alex Morgan handles failed record downloads')}</div>
  ${notice('Review any service still owed','After the final delivery date, stop note reminders and begin the end review at local midnight. Agree completion, an extension with an end date or a settlement. Unused appointments remain owed.')}
  <div class="hl-grid">${section('Service decision',`<p><strong>${coachingState.notesOnly?0:coachingAvailable()+coachingHeld()} appointments still need to be resolved.</strong> Review disputed delivery separately. Missed promised notes inform the service review; they do not have a fixed per-note refund value.</p>${field('Closure reason / agreed outcome',`<textarea id="c-close-reason" class="hl-textarea" rows="3" placeholder="Record the agreed outcome and who will handle anything unresolved">${esc(coachingState.closureReason)}</textarea>`)}<div class="hl-row">${act('Preview service closure','c-close-preview','danger')}${act('Propose dated extension','c-extension')}</div><p class="hl-small hl-muted">Closing the service stops future appointments and note reminders. Maya’s martial arts membership is unchanged.</p>`)}
  ${section('Payment and refund review',`<div class="hl-between"><span>Verified upfront payment</span><strong>${coachingMoney(coachingState.paid)}</strong></div><div class="hl-between"><span>Refunded / pending</span><strong>${coachingMoney(coachingState.refunded)} / ${coachingMoney(coachingState.refundPending)}</strong></div><div class="hl-divider"></div><p>The program was sold without separate prices for notes or appointments. Alex Morgan must explain the refund amount and keep it within the remaining paid balance.</p>${field('Service after this refund','<select id="c-refund-disposition" class="hl-select"><option value="">Choose what happens to the remaining service</option><option value="continue">Keep the agreed service and remaining appointment credits</option><option value="closed">Service already closed; continue reviewing anything still owed</option></select>')}${field('Owner-reviewed refund amount (CAD)','<input id="c-refund-amount" class="hl-input" type="number" min="0.01" step="0.01" placeholder="Enter a reviewed amount">')}${field('Reason for the amount','<textarea id="c-owner-reason" class="hl-textarea" rows="2" placeholder="Accepted terms, service provided and agreed remedy"></textarea>')}<div class="hl-row">${act('Review refund submission','c-refund-amount-preview')}${coachingState.refundPending?act('Refresh refund status','c-refund-refresh'):''}</div>`)}</div>
  ${section('Records the client can receive',`<div class="hl-between"><div><strong>Portable coaching record</strong><p class="hl-muted">Accepted plans, submitted intake, signed agreements, milestones/actions, published notes and authorized transactions.</p></div>${act('Prepare client export','c-export','primary')}</div><p>Includes a file list, linked records, appointment counts, dates and file checksums. Private working notes and unpublished drafts are excluded from the standard export.</p><div class="hl-row">${coachingState.exportStatus==='Queued'?act('Check export status','c-export-check'):''}${coachingState.exportStatus==='Ready'?act('Download sample record','c-export-download'):''}${act('View retrieval policy','c-retrieval')}</div><p class="hl-small hl-muted">Maya has 30 days after service closure to view and download the records she is allowed to access. Record retention and requests for additional records are handled separately.</p>`)}
 `},
 'p-program': {title:'My coaching program',subtitle:'Review your plan, coach and program dates.',icon:'target',navLabel:'My program',group:'Client portal',html:()=>`
  <div class="hl-hero">${coachingPlan()}<p>Coach: <strong>${esc(coachingState.coach)}</strong> · ${coachingStateBadge()}</p><div class="hl-row">${go('Read my daily notes','p-notes','primary')}${coachingState.notesOnly?'':go('My appointment','p-session')}</div></div>
  ${coachingState.pendingPlan?section('Your approval is needed',`<p><strong>Proposed plan v${coachingState.planVersion+1}</strong></p><p>${esc(coachingState.pendingPlan.goal)}</p><p>Proposed end: ${coachingDate(coachingState.pendingPlan.end)}. ${esc(coachingState.pendingPlan.reason)}</p><p class="hl-muted">Your current plan stays in effect until you accept. No new charge is included.</p><div class="hl-row">${act('Accept revised plan','p-plan-accept','primary')}${act('Keep current plan','p-plan-decline')}</div>`):''}
  ${coachingState.replacement?section('Choose your next coach',`${person('Taylor Park','Proposed replacement · available October 9','TP')}<p>Jordan’s access has ended. Taylor can start only after your acceptance.</p><label class="hl-check"><input id="p-history" type="checkbox"> Allow Taylor to read my published notes and shared summaries from this program</label><p class="hl-small hl-muted">Your accepted plan is part of the assignment. Private coach notes and unpublished drafts are never transferred.</p><div class="hl-row">${act('Accept Taylor with these record permissions','p-coach-accept','primary')}${act('Decline replacement','p-coach-decline')}</div>`):''}
  ${coachingState.pendingPause?section('Review your proposed pause',`<p>${coachingDate(coachingState.pendingPause.start)}–${coachingDate(coachingState.pendingPause.end)} · ${coachingState.pendingPause.days} paused delivery days.</p><p>New inclusive end: <strong>${coachingDate(coachingState.pendingPause.newEnd)}</strong>. Notes and reminders stop during the pause. Appointments during it are cancelled and their credits returned. You will need to book again after the pause.</p><div class="hl-row">${act('Accept pause and revised end','p-pause-accept','primary')}${act('Keep current delivery plan','p-pause-decline')}</div>`):''}
  <div class="hl-grid">${section('This week’s focus',`<h3>Make room for a repeatable routine.</h3><p><strong>Agreed milestone:</strong> choose two training days and protect one rest evening. Your coach reviews progress with you.</p><p class="hl-muted hl-small">Your coach shares daily notes here. Bring questions to your next conversation.</p>`)}${section('What your program includes',`<p><strong>Monday–Friday notes</strong> by 18:00 Vancouver time through ${coachingDate(coachingState.end)}, including the final delivery date.</p><p><strong>${coachingState.notesOnly?'Zero':'Four'} included appointments.</strong> Notes do not use appointment credits or create daily charges.</p><p>At program end, we review any unused appointments. They are not removed automatically.</p><div class="hl-row">${go('My gym membership','m-membership')}${act('Get program support','p-support')}</div>`)} </div>
  ${coachingState.pause?notice('Your accepted pause',coachingDate(coachingState.pause.start)+'–'+coachingDate(coachingState.pause.end)+'. Note delivery resumes on the next agreed delivery day. Revised end: '+coachingDate(coachingState.end)+'. Cancelled appointments require a fresh booking.','warning'):''}
  ${coachingState.status==='service-closed'?notice('Program service has closed','You still have the agreed 30 days to view and download your permitted records. Payment reviews and exports may still be in progress. Your gym membership is unchanged.','warning'):''}
 `},
 'p-notes': {title:'My day',subtitle:'Your coach’s daily notes.',icon:'book-open',navLabel:'My day',group:'Client portal',html:()=>`
  <div class="hl-between"><div class="hl-kicker">${coachingProgramName().toUpperCase()}</div>${go('Back to my program','p-program')}</div>
  ${coachingState.noteStatus==='withdrawn'?notice('October 9 note withdrawn','This note is no longer available. Northstar is reviewing the publication and will contact you through the agreed support channel.','warning'):coachingState.published?section(coachingDate(coachingState.noteDate),`<div class="hl-row">${badge(coachingState.noteVersion>1?'Corrected · v'+coachingState.noteVersion:'Published','success')}${badge(coachingState.noteAuthor)}</div><p class="hl-small hl-muted">Program date: ${coachingDate(coachingState.noteDate)} · Published October 9, 2026 at 16:20 PDT${coachingState.noteVersion>1?' · Previous version retained in your record':''}</p><p style="white-space:pre-wrap">${esc(coachingState.published)}</p><div class="hl-row">${act(coachingState.readNote?'Marked as read':'Mark as read','p-note-read')}${act('View publication history','p-note-history')}</div>`):notice(coachingState.status==='scheduled'?'Your program is scheduled':'Your next note is due today',coachingState.status==='scheduled'?'Delivery begins October 19. Your upfront payment is verified; no appointment purchase is required.':'Today’s update is due by 18:00 Vancouver time. Only published notes appear here; drafts and private working notes are never shown.')}
  ${coachingState.start<='2026-10-08'?section('Thursday, October 8',`<div class="hl-row">${badge('Published','success')}${badge('Jordan Lee')}</div><p class="hl-muted hl-small">Program date: October 8 · Published October 9, 2026 at 09:10 PDT (late delivery recorded)</p><h3>Start with the week you actually have.</h3><p>Choose two training days you can comfortably protect. Leave room for recovery between them. The aim this week is a routine you can repeat, rather than a perfect calendar.</p><p>At our next conversation, we will review which part felt easiest to maintain and agree one adjustment.</p>`):''}

 `},
 'p-session': {title:'My coaching appointment',subtitle:'View your time, change a booking or check appointment credits.',icon:'calendar',navLabel:'My appointment',group:'Client portal',html:()=>`
  ${coachingUnits()}${coachingState.notesOnly?notice('This program is delivered through notes','No appointments were included or required. You can continue reading your coach’s published updates.'):section(coachingState.session.status==='confirmed'?'Your confirmed time':'Choose an included appointment',`${coachingState.session.status==='confirmed'?`<div class="hl-kicker">${coachingDate(coachingState.session.date)} · ${coachingState.session.time} PDT</div><h2>One-to-one with ${esc(coachingState.coach)}</h2><p>50 minutes · Northstar consultation room · America/Vancouver</p><p>One appointment credit is reserved. The accepted session outcome determines whether it is used or returned.</p><div class="hl-row">${act('Change appointment','p-reschedule','primary')}${act('Cancel with preview','p-cancel')}${act('View arrival details','p-arrival')}</div>`:`${notice('Availability is checked again when you book','A time is confirmed only when both the booking and its credit reservation succeed. External calendars may not be synced.')}<div class="hl-row">${act('Oct 14 · 17:00 PDT','p-book','primary','data-time="17:00"')}${act('Oct 14 · 18:00 PDT','p-book','secondary','data-time="18:00"')}</div>`}<div class="hl-divider"></div><p><strong>Your accepted policy:</strong> cancel at least 24 hours before the confirmed start to get your credit back. A late cancellation or verified no-show uses one credit; no automatic cash penalty is added.</p><p>A move before the cutoff transfers the same reserved credit. If the new slot cannot be confirmed, your original appointment stays in place.</p>`)}
  ${coachingState.past==='disputed'?notice('October 8 delivery is under review','One credit stays on hold while Alex Morgan reviews the evidence they are allowed to access. You will receive an outcome within 2 business days.','warning'):''}

 `}
};

const coachingActions = {
 'c-acceptance':()=>showDialog('Maya’s enrollment record',coachingAcceptance(),act('View restricted intake','c-intake','primary')+act('Close record','c-dialog-close')),

 'c-reviewer-accept':()=>{if(!coachingChecked('c-reviewer-consent'))return toast('Client acceptance is required.');coachingState.reviewerAccepted=true;coachingState.inquiryStage=2;closeDialog();render();showDialog('Restricted intake is now available',`${field('Why the client is seeking coaching','<textarea id="c-inquiry-purpose" class="hl-textarea" rows="3" placeholder="The client’s own words, visible to the approved reviewer"></textarea>')}${field('Mutual fit outcome','<select id="c-fit" class="hl-select"><option value="fit">Fit confirmed together</option><option value="discussion">Further discussion</option><option value="declined">Close without purchase</option><option value="no-show">Discovery no-show</option></select>')}<p>Discovery is optional and free. Closing an inquiry sends no diagnosis or client information to a referral.</p>`,act('Record intake and fit outcome','c-fit-save','primary'));},
 'c-fit-save':()=>{if(!coachingState.reviewerAccepted)return toast('The client must approve a named reviewer first.');coachingState.inquiryNotes=coachingValue('c-inquiry-purpose');coachingState.inquiryStage=coachingValue('c-fit')==='fit'?3:1;closeDialog();render();toast('Restricted intake and mutual fit outcome recorded. No purchase created.');},
 'c-intake':()=>{if(coachingState.status==='awaiting-replacement')return toast('The outgoing coach no longer has access. Wait for the client to accept a replacement.');showDialog('Maya’s accepted intake',`<p>${badge('Restricted · assigned coach','warning')}</p><p><strong>Submitted October 2 · intake v1</strong></p><p>Maya wants a manageable routine that balances training, work and rest. Agreement v2 and plan v${coachingState.planVersion} were accepted through her verified account.</p><p>Audience: Maya and the coach she accepted. Reception, payers and previous guardians have no standard access.</p>`,go('Continue to program','c-program','primary'));},
 'c-offer':()=>showDialog('Focus Reset · future-start enrollment',`<p><strong>October 19–30, 2026 · America/Vancouver</strong></p><p>10 weekday coach notes, by 18:00 · zero appointments · Jordan Lee · CA$180 upfront.</p><p>The client accepts this plan, note schedule, coach, agreement and owner-reviewed refund and exit terms. There is no fixed automatic refund per note.</p><label class="hl-check"><input id="c-offer-consent" type="checkbox"> Preview the client’s acceptance of this plan and agreement.</label>${notice('Prototype enrollment preview','This separate offer demonstrates a notes-only, future-start purchase. It does not replace Maya’s current program or make a real charge.')}`,act('Preview pending payment','c-offer-pending','primary')),
 'c-offer-pending':()=>{if(!coachingChecked('c-offer-consent'))return toast('Preview acceptance of the plan and agreement first.');showDialog('Payment pending · no delivery access',`<p>Focus Reset · CA$180 · accepted start October 19.</p><p>Returning from payment does not confirm that it succeeded. The program stays inactive and receives no appointment credits until payment is verified.</p>`,act('Preview verified payment','c-offer-verified','primary'));},

// Cards use relevant record content and balanced spacing, without filler footers.
function metricIconFor(label){
 if(/refund|credit|fee|invoice|payment|settlement/i.test(label))return 'wallet-cards';
 if(/form|authority/i.test(label))return 'shield-check';
 if(/checked|delivered|reconciled/i.test(label))return 'circle-check';
 if(/client|member|people|payer/i.test(label))return 'users';
 if(/inquiry|export/i.test(label))return 'inbox';
 if(/response/i.test(label))return 'clock-3';
 return 'calendar-days';
}
const balancedCards=new Set(['a-today|This evening','a-exports|Leaving HitLink','c-program|Milestones agreed with Maya']);
function cardLayoutFor(title){
 const key=uiState.page+'|'+title;
 return {className:(balancedCards.has(key)?' hl-panel-balanced':'')+(key==='c-close|Service decision'?' hl-panel-writing':''),footer:''};
}

// A card's final decision belongs at its bottom edge. Keep record actions in
// their rows, and keep any short explanation attached to the final decision.
function prepareCardLayouts(scope){
 const isAction=element=>element?.matches('.hl-button')||element?.matches('.hl-row')&&element.children.length>0&&[...element.children].every(child=>child.matches('.hl-button'));
 scope.querySelectorAll('.hl-panel').forEach(panel=>{
  let action=panel.lastElementChild;const notes=[];
  while(action?.matches('p.hl-small,.hl-notice')){notes.unshift(action);action=action.previousElementSibling;}
  if(!isAction(action))return;
  const footer=document.createElement('div');footer.className='hl-panel-actions';
  panel.classList.add('hl-panel-with-actions');panel.appendChild(footer);
  footer.append(action,...notes);
 });
}

const fontPairs={
 'barlow-source':{heading:'Barlow Semi Condensed',body:'Source Sans 3'},
 'plex':{heading:'IBM Plex Sans Condensed',body:'IBM Plex Sans'},
 'manrope-source':{heading:'Manrope',body:'Source Sans 3'}
};
let typographyReady=Promise.resolve(),requestedTypography=null,fontRevision=0;
function applyTypography(){
 const choice=designState.typography;
 if(choice===requestedTypography)return;
 requestedTypography=choice;
 const revision=++fontRevision,pair=fontPairs[choice];
 if(!document.fonts?.load)return;
 // Apply each pair together, before revealing the initial skeleton. If a font
 // service is unavailable, keep the system fallback instead of swapping late.
 const specs=[...[400,500,600,700].map(weight=>`${weight} 14px "${pair.body}"`),...[600,700].map(weight=>`${weight} 30px "${pair.heading}"`)];
 const loaded=Promise.all(specs.map(spec=>document.fonts.load(spec,'HitLink Today 0123456789'))).then(faces=>faces.every(list=>list.length>0)).catch(()=>false);
 typographyReady=new Promise(resolve=>{
  let finished=false;
  const finish=ready=>{
   if(finished)return;finished=true;clearTimeout(timeout);
   if(ready&&revision===fontRevision)root.dataset.typography=choice;
   resolve();
  };
  const timeout=setTimeout(()=>finish(false),1800);
  loaded.then(finish);
 });
}

// This standalone mockup simulates a data read. Production should resolve the
// same loading state from its request, without a minimum artificial delay.
const previewLoadingMs=450;
let loadingTimer=null,loadingRevision=0;
const loadingStatus=document.createElement('div');
loadingStatus.className='hl-loading-status';loadingStatus.setAttribute('role','status');loadingStatus.setAttribute('aria-live','polite');root.appendChild(loadingStatus);
function cancelLoading(){
 clearTimeout(loadingTimer);loadingTimer=null;loadingRevision++;
 root.querySelector('#hl-main').setAttribute('aria-busy','false');root.dataset.loading='false';loadingStatus.textContent='';
}
function skeletonFor(route){
 const skeleton=document.createElement('div');skeleton.className='hl-skeleton';skeleton.setAttribute('aria-hidden','true');
 const origin=route.getBoundingClientRect();
 function shape(element,type){
  const rect=element.getBoundingClientRect();if(rect.width<2||rect.height<2)return;
  const node=document.createElement('span');let width=rect.width,height=rect.height,top=rect.top-origin.top;
  if(type==='line'){height=Math.min(height,element.matches('h1,.hl-metric-value,.hl-allowance-value')?26:12);top+=(rect.height-height)/2;width=Math.min(width,Math.max(32,width*.78));}
  node.className=type==='surface'?'hl-skeleton-surface'+(element.classList.contains('hl-hero')?' hero':''):'hl-skeleton-shape'+(type==='avatar'?' avatar':'');
  node.style.cssText=`left:${rect.left-origin.left}px;top:${top}px;width:${width}px;height:${height}px`;
  skeleton.appendChild(node);
 }
 route.querySelectorAll('.hl-panel,.hl-metric,.hl-hero,.hl-notice,.hl-empty,.hl-card-context-row,.hl-card-steps').forEach(element=>shape(element,'surface'));
 const selector='h1,h2,h3,p,.hl-kicker,.hl-metric-label,.hl-metric-value,.hl-metric-detail,.hl-metric-icon,.hl-card-context-icon,.hl-card-context strong,.hl-tag,.hl-avatar,.hl-button,.hl-field>span,input:not([type=checkbox]):not([type=radio]),select,textarea,th,td,dt,dd,.hl-summary-number,.hl-allowance-num,.hl-person strong,.hl-class-time,.hl-day,.hl-step,.hl-check';
 route.querySelectorAll(selector).forEach(element=>{
  if(element.parentElement.closest(selector)&&element.parentElement.closest(selector)!==route)return;
  shape(element,element.matches('.hl-avatar')?'avatar':element.matches('input,select,textarea,.hl-button,.hl-day')?'control':'line');
 });
 return skeleton;
}
function startLoading(route,title){
 const main=root.querySelector('#hl-main'),frame=route.parentElement,revision=loadingRevision;

 ],

function webValidate(content){
 const errors=[];
 if(!content.title.trim())errors.push({field:'web-page-title',message:'Add a page heading.'});
 if(!content.description.trim())errors.push({field:'web-page-description',message:'Add a short introduction.'});
 if(!content.plans.some(plan=>plan.visible))errors.push({message:'Show at least one plan on the public page.'});
 content.plans.forEach((plan,index)=>{
  const name=plan.name.trim()||`Plan ${index+1}`;
  if(!plan.name.trim())errors.push({planId:plan.id,message:`${name}: add a plan name.`});
  if(!/^\d{1,6}(\.\d{1,2})?$/.test(plan.price.trim())||!Number.isFinite(Number(plan.price))||Number(plan.price)<0)errors.push({planId:plan.id,message:`${name}: enter a CAD price of zero or more, with up to two decimal places.`});
  if(!Object.hasOwn(webPeriods,plan.period))errors.push({planId:plan.id,message:`${name}: choose a billing display.`});
  if(!plan.description.trim())errors.push({planId:plan.id,message:`${name}: add a description.`});
  if(!plan.features.length||plan.features.some(feature=>!feature.trim()))errors.push({planId:plan.id,message:`${name}: add at least one included feature.`});
 });
 if(content.featuredId&&!content.plans.some(plan=>plan.id===content.featuredId&&plan.visible))errors.push({message:'Choose a visible plan to highlight, or select no highlighted plan.'});
 if(content.featuredId&&!content.highlightLabel.trim())errors.push({field:'web-highlight-label',message:'Add a label for the highlighted plan.'});
 if(!webStateFits(content,content))errors.push({message:'Shorten the page or plan text so this preview can save both your draft and published pricing.'});
 return errors;
}
function webSanitizeContent(value){
 if(!value||!Array.isArray(value.plans)||!value.plans.length||value.plans.length>4)return null;
 const ids=new Set();
 const plans=[];
 for(const plan of value.plans){
  if(!plan||typeof plan.id!=='string'||!/^[-a-z0-9]{1,40}$/.test(plan.id)||ids.has(plan.id))return null;
  ids.add(plan.id);
  plans.push({id:plan.id,name:String(plan.name??'').slice(0,60),price:String(plan.price??'').slice(0,12),period:Object.hasOwn(webPeriods,plan.period)?plan.period:'month',description:String(plan.description??'').slice(0,160),features:Array.isArray(plan.features)?plan.features.slice(0,4).map(feature=>String(feature).slice(0,90)).filter(feature=>feature.trim()):[],visible:plan.visible!==false});
 }
 return {title:String(value.title??'').slice(0,80),description:String(value.description??'').slice(0,180),plans,featuredId:plans.some(plan=>plan.id===value.featuredId&&plan.visible)?value.featuredId:null,highlightLabel:String(value.highlightLabel??'').slice(0,32)};
}

 websiteState.draft=draft;websiteState.published=published;
 websiteState.publication=Number.isInteger(saved.publication)?Math.max(1,Math.min(9999,saved.publication)):1;

function visitorIdentity(){
 const f=visitorState.form,child=f.participant==='child',accountName=visitorName(f.first,f.last);
 const identity={kind:child?'child':'adult',name:child?visitorName(f.childFirst,f.childLast):accountName,age:child?Number(f.childAge):null,accountName,email:f.email.trim(),accountKey:visitorAccountKey()};
 identity.key=JSON.stringify([identity.kind,identity.name,identity.age,identity.accountKey]);
 identity.guardianKey=JSON.stringify([identity.key,f.guardianConsent]);
 return identity;
}
const visitorEmailVerified=()=>visitorState.verifiedAccount===visitorAccountKey();
const visitorGuardianVerified=()=>visitorState.form.participant!=='child'||visitorState.verifiedGuardian===visitorIdentity().guardianKey;
const visitorReady=()=>visitorEmailVerified()&&visitorGuardianVerified();
const visitorWaiver=identity=>visitorState.waivers[identity.key]||null;
const visitorPlanFingerprint=plan=>JSON.stringify([plan.id,plan.name,plan.price,plan.period,plan.description,plan.features,plan.visible]);
function visitorKnownPlan(plan){
 const original=webInitialContent.plans.find(item=>item.id===plan.id);
 return !!original&&visitorPlanFingerprint(original)===visitorPlanFingerprint(plan);
}
function visitorPlanCurrent(){
 const selected=visitorState.selectedPlan;
 const current=selected&&websiteState.published.plans.find(plan=>plan.id===selected.plan.id&&plan.visible);
 return !!current&&visitorPlanFingerprint(current)===selected.fingerprint;
}
function visitorRequireCurrentPlan(){
 if(visitorState.activation)return false;
 if(!visitorPlanCurrent()||websiteState.view==='draft'){
  visitorState.termsAccepted=false;visitorState.paymentQuote=null;closeDialog({immediate:true});render();
  toast('This offer changed. Choose the current published membership and review its terms.');return false;
 }
 return true;
}
function visitorSelectPlan(planId){
 if(visitorState.activation){navigate('v-enroll');toast('Your sample membership is already active. No second payment was created.');return;}
 if(websiteState.view==='draft'){toast('Publish this pricing before joining.');return;}
 const plan=websiteState.published.plans.find(item=>item.id===planId&&item.visible);
 if(!plan||!/^\d{1,6}(\.\d{1,2})?$/.test(String(plan.price).trim())||!Object.hasOwn(webPeriods,plan.period)){toast('Choose an available published membership.');return;}
 visitorState.selectedPlan={plan:webClone(plan),publication:websiteState.publication,fingerprint:visitorPlanFingerprint(plan)};
 visitorState.termsAccepted=false;visitorState.paymentQuote=null;visitorState.inquiry=null;
 navigate('v-enroll');
}
function visitorValidateIdentity(){
 const f=visitorState.form;
 if(!f.first.trim()||!f.last.trim()||!/^\S+@\S+\.\S+$/.test(f.email.trim())||!f.ageConfirmed){toast('Enter your first and last name, a valid email and confirm you are 18 or older.');return false;}
 if(f.participant==='child'&&(!f.childFirst.trim()||!f.childLast.trim()||!Number.isInteger(Number(f.childAge))||Number(f.childAge)<8||Number(f.childAge)>12)){toast('Enter the child’s name and age. This junior trial is for ages 8–12.');return false;}
 if(f.participant==='child'&&!f.guardianConsent){toast('Confirm you are the child’s parent or legal guardian. The gym must verify that authority separately.');return false;}
 return true;
}
function visitorInput(name,id,type='text',extra=''){
 return `<input class="hl-input" id="${id}" data-visitor-field="${name}" type="${type}" value="${esc(visitorState.form[name])}" ${extra}>`;
}
function visitorIdentityForm(){
 const f=visitorState.form,child=f.participant==='child';
 return `${field('Who is training?',`<select class="hl-select" id="v-person" data-visitor-field="participant"><option value="adult" ${!child?'selected':''}>Myself · adult</option><option value="child" ${child?'selected':''}>My child</option></select>`)}${child?`<div class="hl-grid">${field('Child’s first name',visitorInput('childFirst','v-child-first','text','autocomplete="off" maxlength="60"'))}${field('Child’s last name',visitorInput('childLast','v-child-last','text','autocomplete="off" maxlength="60"'))}</div>${field('Child’s age',visitorInput('childAge','v-child-age','number','min="8" max="12" inputmode="numeric"'))}<h3>Parent or legal guardian</h3>`:''}<div class="hl-grid">${field('Your first name',visitorInput('first','v-first','text','autocomplete="given-name" maxlength="60"'))}${field('Your last name',visitorInput('last','v-last','text','autocomplete="family-name" maxlength="60"'))}</div>${field('Your email',visitorInput('email','v-email','email','autocomplete="email" maxlength="160"'))}<label class="hl-check"><input id="v-confirm-age" data-visitor-field="ageConfirmed" type="checkbox" ${f.ageConfirmed?'checked':''}> I am 18 or older.</label>${child?`<label class="hl-check"><input id="v-guardian-consent" data-visitor-field="guardianConsent" type="checkbox" ${f.guardianConsent?'checked':''}> I am this child’s parent or legal guardian and request permission to book and sign for them.</label><p class="hl-small hl-muted">Email verification does not prove guardian authority. The gym reviews that separately.</p>`:''}<div id="v-identity-status" aria-live="polite">${visitorIdentityStatus()}</div>`;
}
function visitorIdentityStatus(){
 if(!visitorEmailVerified())return '<p class="hl-small hl-muted">Verify your email before reserving a trial or paying. This preview sends no email.</p>';
 return `<p class="hl-small">${badge('Email verified','success')}${visitorState.form.participant==='child'?' '+badge(visitorGuardianVerified()?'Guardian authority verified':'Guardian review needed',visitorGuardianVerified()?'success':'warning'):''}</p>`;
}
function visitorNextAction(context){
 const attrs=`data-context="${context}"`;
 if(!visitorEmailVerified())return act('Verify email','visitor-verify','primary',attrs);
 if(!visitorGuardianVerified())return act('Review guardian verification','visitor-guardian','primary',attrs);
 return context==='trial'?act('Reserve free trial','visitor-reserve','primary'):act('Review sample payment','visitor-pay','primary');
}
function visitorRefreshFormStatus(){
 const status=root.querySelector('#v-identity-status');if(status)status.innerHTML=visitorIdentityStatus();
 const actions=root.querySelector('#v-main-actions');if(actions)actions.innerHTML=visitorNextAction(actions.dataset.context);
 const terms=root.querySelector('#v-terms');if(terms)terms.checked=visitorState.termsAccepted;
}
function visitorCaptureField(event){
 const input=event.target.closest('[data-visitor-field]');if(!input)return;
 const name=input.dataset.visitorField;
 if(name==='termsAccepted'){visitorState.termsAccepted=input.checked;return;}
 if(!Object.hasOwn(visitorState.form,name))return;
 const value=input.type==='checkbox'?input.checked:input.value;
 if(visitorState.form[name]===value)return;
 visitorState.form[name]=value;
 if(name!=='marketing'){visitorState.form.marketing=false;visitorState.termsAccepted=false;visitorState.paymentQuote=null;visitorState.inquiry=null;}
 if(name==='participant'){render();return;}
 visitorRefreshFormStatus();
}
root.addEventListener('input',visitorCaptureField);
root.addEventListener('change',visitorCaptureField);
function visitorClass(identity=visitorIdentity()){

function visitorOfferSummary(plan){
 return `<div class="hl-stack"><p><strong class="hl-summary-number">${esc(webMoney(plan.price))}</strong> <span class="hl-small hl-muted">${esc(webPeriods[plan.period])}</span></p><p class="hl-small">${esc(plan.description)}</p><ul class="web-feature-list">${plan.features.map(feature=>`<li>${esc(feature)}</li>`).join('')}</ul></div>`;

function visitorMembershipTerms(plan){

}
function visitorEnrollmentPage(){
 const active=visitorState.activation;
 if(active)return section(esc(active.plan.name),`<div class="hl-stack">${details([['Member',esc(active.identity.name)],['Paid',esc(webMoney(active.plan.price))],['Billing cycle','9 Oct–8 Nov 2026'],['Next payment','9 Nov · '+esc(webMoney(active.plan.price))],['Class access',active.limits.weekly===null?'Unlimited eligible classes':`${active.limits.weekly} per training week${active.limits.monthly===null?'':`; ${active.limits.monthly} per billing month`}`],['Waiver',visitorWaiver(active.identity)?'Signed · v3.1':'Required before attendance']])}<p class="hl-small hl-muted">Sample payment confirmed once. ${visitorWaiver(active.identity)?(visitorState.trial?.identity.key===active.identity.key?'Your trial and signed waiver stay with this participant.':'Your signed waiver stays with this membership.'):'Sign the training waiver before attending.'}</p><div class="hl-row">${visitorWaiverAction(active.identity,'activation')}${go('View memberships','v-pricing')}</div></div>`);
 const selection=visitorState.selectedPlan;
 if(!selection)return section('Choose a membership',`<div class="hl-stack"><p>Choose a published plan to see its price and terms before joining.</p><div class="hl-row">${go('View memberships','v-pricing','primary')}${go('Try a class first','v-trial','ghost')}</div></div>`);
 const plan=selection.plan,current=visitorPlanCurrent(),known=visitorKnownPlan(plan),adult=visitorState.form.participant==='adult';
 let continuation;
 if(!current)continuation=notice('This offer changed','Return to memberships and review the current published offer. No payment has been taken.','warning',go('View current memberships','v-pricing','primary'));
 else if(!known||!adult)continuation=section(!adult?'Ask about a junior membership':'Confirm this plan’s terms',`<div class="hl-stack"><p>${!adult?'This published plan is for adults. Your child remains the selected participant. Ask the gym about junior options, or choose “Myself · adult” above to join for yourself.':'The published offer has changed from the sample contract. The gym must confirm class limits, billing, eligibility and cancellation terms before you accept or pay.'}</p>${visitorState.inquiry?notice('Request preview prepared',`For ${esc(visitorState.inquiry.identity.name)} · ${esc(visitorState.inquiry.plan.name)}. No request was sent and no payment was taken.`,'success'):act('Preview request for details','visitor-request-details','primary')}<p class="hl-small hl-muted">${!adult?'No junior paid plan is defined in this preview.':'The displayed price and features are preserved; they have not been converted into membership rules.'}</p></div>`);
 else continuation=section('Membership terms',`<div class="hl-stack">${visitorMembershipTerms(plan)}<label class="hl-check"><input id="v-terms" data-visitor-field="termsAccepted" type="checkbox" ${visitorState.termsAccepted?'checked':''}> I accept membership policy v2.1, including these class limits, billing and cancellation terms.</label><div id="v-main-actions" data-context="enroll" class="hl-row">${visitorNextAction('enroll')}</div><p class="hl-small hl-muted">This preview does not collect card details or charge money. Your membership activates only after a sample payment confirmation.</p></div>`);
 return `<div class="hl-stack">${workspaceBack('Memberships','v-pricing')}<div class="hl-grid-wide">${section('Participant & payer',visitorIdentityForm())}${section(esc(plan.name),visitorOfferSummary(plan))}</div>${continuation}</div>`;
}
function visitorOpenVerification(context){
 if(context==='enroll'&&!visitorRequireCurrentPlan())return;
 if(!visitorValidateIdentity())return;
 visitorState.verification={context,accountKey:visitorAccountKey(),planFingerprint:context==='enroll'?visitorState.selectedPlan?.fingerprint:null};
 showDialog('Verify your email',`<div class="hl-stack">${details([['Email',esc(visitorState.form.email.trim())],['Account holder',esc(visitorName(visitorState.form.first,visitorState.form.last))]])}<p>This simulates opening a verification link. No email is sent. Verification does not create a trial booking or take payment.</p></div>`,act('Back','close-dialog')+act('Simulate verified email','visitor-email-confirm','primary'));
}
function visitorOpenGuardian(){
 if(!visitorValidateIdentity()||!visitorEmailVerified())return toast('Verify the guardian’s email first.');
 const identity=visitorIdentity();if(identity.kind!=='child')return;
 visitorState.guardianReview=webClone(identity);
 showDialog('Review guardian authority',`<div class="hl-stack">${details([['Child',esc(identity.name)+' · age '+identity.age],['Guardian',esc(identity.accountName)],['Email','Verified'],['Requested permissions','Book this child’s trial and sign the training waiver']])}<p>The gym must verify the relationship. A shared email or payment method is not proof.</p><label class="hl-check"><input type="checkbox" id="v-guardian-checked"> In this simulation, the gym has checked the guardian’s authority for this child.</label></div>`,act('Back','close-dialog')+act('Simulate verified authority','visitor-guardian-confirm','primary'));
}
function visitorOpenWaiver(record){
 const source=record==='activation'?visitorState.activation:visitorState.trial;if(!source)return;
 const identity=source.identity,signed=visitorWaiver(identity);visitorState.waiverTarget=webClone(identity);
 showDialog(signed?'Signed training waiver · v3.1':'Read & sign training waiver',`<div class="hl-stack">${details([['Participant',esc(identity.name)],['Signer',esc(identity.accountName)],['Authority',identity.kind==='child'?'Verified parent or legal guardian':'Adult signing for self'],['Version','3.1 · effective 1 Oct 2026']])}<p class="hl-small">${esc(visitorWaiverText)}</p>${signed?`<div class="hl-signature">${esc(signed.signer)}</div><p class="hl-small hl-muted">Accepted 9 Oct 2026. Exact text and participant retained in this preview.</p>`:`<label class="hl-check"><input id="v-waiver-consent" type="checkbox"> I have read and accept version 3.1 for ${esc(identity.name)}.</label><label class="hl-check"><input id="v-marketing" data-visitor-field="marketing" type="checkbox" ${visitorState.form.marketing?'checked':''}> Send me optional gym news and offers.</label>`}</div>`,act(signed?'Done':'Back','close-dialog')+(signed?'':act('Sign sample waiver','visitor-waiver-confirm','primary')));
}
const visitorViews={
 'v-trial':{title:()=>visitorState.trial?'Trial reserved':'Try a class at Northstar',subtitle:()=>visitorState.trial?'Your class and required waiver.':'Choose who is training, then reserve a free trial.',icon:'sparkles',navLabel:'Try a class',group:'New visitor',html:visitorTrialPage},
 'v-enroll':{title:()=>visitorState.activation?'Membership activated':'Join Northstar',subtitle:()=>visitorState.activation?'Your confirmed sample membership.':'Review your selected plan, participant and terms.',icon:'wallet-cards',navLabel:'Join Northstar',group:'New visitor',html:visitorEnrollmentPage}
};
const visitorActions={
 'visitor-verify':el=>visitorOpenVerification(el?.dataset.context||'trial'),
 'visitor-email-confirm':()=>{
  const pending=visitorState.verification;if(!pending)return;
  if(pending.context==='enroll'&&(!visitorRequireCurrentPlan()||pending.planFingerprint!==visitorState.selectedPlan?.fingerprint))return;
  if(pending.accountKey!==visitorAccountKey()||!visitorValidateIdentity()){closeDialog({immediate:true});return toast('Your details changed. Verify the current email again.');}
  visitorState.verifiedAccount=pending.accountKey;visitorState.verification=null;closeDialog({immediate:true});render();toast('Sample email verified. No booking or payment was made.');
 },
 'visitor-guardian':()=>visitorOpenGuardian(),
 'visitor-guardian-confirm':()=>{
  const identity=visitorState.guardianReview;
  if(!identity||identity.guardianKey!==visitorIdentity().guardianKey||!visitorEmailVerified())return visitorDialogError('The child or guardian details changed. Review them again.');
  if(!root.querySelector('#v-guardian-checked')?.checked)return visitorDialogError('Confirm the sample authority review before continuing.');
  visitorState.verifiedGuardian=identity.guardianKey;visitorState.guardianReview=null;closeDialog({immediate:true});render();toast('Sample guardian authority verified for '+identity.name+'.');
 },
 'visitor-reserve':()=>{
  if(visitorState.trial)return;
  if(!visitorValidateIdentity()||!visitorReady())return toast('Complete email and any guardian verification before reserving.');
  const identity=webClone(visitorIdentity());visitorState.trial={identity,class:visitorClass(identity)};closeDialog({immediate:true});render();
 },
 'visitor-waiver':el=>visitorOpenWaiver(el?.dataset.record||'trial'),
 'visitor-waiver-confirm':()=>{
  const identity=visitorState.waiverTarget;if(!identity||visitorWaiver(identity))return;
  if(identity.accountKey!==visitorAccountKey()||!visitorEmailVerified()||(identity.kind==='child'&&visitorState.verifiedGuardian!==identity.guardianKey))return visitorDialogError('Verify the original signer’s account and authority before signing this participant’s waiver.');
  if(!root.querySelector('#v-waiver-consent')?.checked)return visitorDialogError('Accept the training waiver before signing. Marketing consent is optional.');
  visitorState.waivers[identity.key]={signer:identity.accountName,participant:identity.name,text:visitorWaiverText,version:'3.1'};visitorState.waiverTarget=null;closeDialog({immediate:true});render();toast('Training waiver signed for '+identity.name+'.');
 },
 'visitor-request-details':()=>{
  if(!visitorRequireCurrentPlan()||!visitorValidateIdentity())return;
  visitorState.inquiry={identity:webClone(visitorIdentity()),plan:webClone(visitorState.selectedPlan.plan)};render();
 },
 'visitor-pay':()=>{
  if(!visitorRequireCurrentPlan()||!visitorValidateIdentity())return;
  const plan=visitorState.selectedPlan.plan;
  if(!visitorKnownPlan(plan)||visitorState.form.participant!=='adult')return toast('The gym must confirm this participant’s membership terms before payment.');
  if(!visitorReady())return toast('Verify your email before payment.');
  if(!visitorState.termsAccepted)return toast('Review and accept the membership terms before payment.');
  visitorState.paymentQuote={identity:webClone(visitorIdentity()),plan:webClone(plan),fingerprint:visitorState.selectedPlan.fingerprint,publication:visitorState.selectedPlan.publication};
  showDialog('Sample first payment',`<div class="hl-stack">${details([['Member',esc(visitorState.paymentQuote.identity.name)],['Membership',esc(plan.name)],['Due today',esc(webMoney(plan.price))],['Billing',esc(webPeriods[plan.period])+' · renews on the 9th']])}<p>No card details are collected and no money is charged. The button below simulates a verified payment-provider confirmation.</p><p class="hl-small hl-muted">Until that confirmation, no membership or class allowance is active.</p></div>`,act('Back','close-dialog')+act('Simulate confirmed payment','visitor-payment-confirm','primary'));
 },
 'visitor-payment-confirm':()=>{
  if(visitorState.activation)return;
  const quote=visitorState.paymentQuote;
  if(!quote||!visitorRequireCurrentPlan())return;
  if(!visitorState.termsAccepted||quote.identity.key!==visitorIdentity().key||!visitorReady()||quote.fingerprint!==visitorState.selectedPlan?.fingerprint||!visitorKnownPlan(quote.plan)||quote.identity.kind!=='adult')return visitorDialogError('Your details or terms changed. Review the membership again.');
  visitorState.activation={identity:quote.identity,plan:quote.plan,limits:{...visitorLimits[quote.plan.id]},publication:quote.publication,termsVersion:'2.1'};visitorState.paymentQuote=null;closeDialog({immediate:true});render();
 }
};

/* Coach assignments belong to individual dates, separately from timetable edits. */
let coachAssignmentState=null;
function coachStaffOptions(current=''){
 const names=[...demoClasses.map(item=>item.coach),'Jordan Lee','Asha Singh','Alex Park',current].map(name=>String(name||'').trim()).filter(Boolean);
 return Object.fromEntries([...new Set(names)].sort((a,b)=>a.localeCompare(b)).map(name=>[name,name]));
}
function coachAssignmentButton(item,day){
 const occurrence=csOccurrence(item.id,day);
 if(!occurrence)return '';
 const label=occurrence.coach?'Change coach':'Assign coach';
 return act(label,'class-coach','ghost',`data-class="${esc(item.id)}" data-date="${esc(csDate(day))}" aria-label="${esc(label+' for '+occurrence.title+' on '+ceDateLabel(csDate(day)))}"`);
}
function caCoachLabel(value){return value||'Unassigned';}
function caModeLabel(mode,defaultCoach){
 return mode==='inherit'?'Use default coach'+(defaultCoach?' · '+defaultCoach:' · none set'):mode==='assigned'?'Assigned for this date':'Leave unassigned';
}
function caSelect(id,options,value){
 return `<select class="hl-select" id="${id}">${Object.entries(options).map(([key,label])=>`<option value="${esc(key)}" ${key===value?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
}
function caBody(){
 const state=coachAssignmentState,item=csOccurrence(state.id,state.date),review=state.review;
 if(!item)return notice('Class no longer scheduled','Close this window and choose another class.','danger');
 const before=review.before||item,after=review.after;
 let body=`<div class="ca-assignment hl-stack"><p class="hl-small hl-muted">${esc(item.title)} · ${esc(ceDateLabel(state.date))}<br>${esc(demoClassRange(item))} · ${esc(item.space)}</p>${field('Coach for this class',caSelect('ca-mode',{inherit:caModeLabel('inherit',item.defaultCoach),assigned:'Choose a coach',unassigned:'Leave unassigned'},state.mode))}${state.mode==='assigned'?field('Coach',caSelect('ca-coach',{'':'Select coach',...coachStaffOptions(state.coach)},state.coach)):''}<p class="hl-small hl-muted">${state.mode==='inherit'?'Follows the default coach if it changes.':'Applies only to this date. Later timetable changes still apply.'}</p>`;
 if(state.saveError)body+=notice('Review the latest details',esc(state.saveError),'warning');
 if(review.errors?.length)body+=`<div class="hl-notice danger" role="alert">${icon('circle-alert')}<div class="hl-notice-content"><strong>Cannot save this assignment</strong><ul>${review.errors.map(error=>`<li>${esc(error.message)}</li>`).join('')}</ul></div></div>`;
 if(review.conflicts?.length)body+=`${notice('Scheduling conflict','Choose another coach or leave this class unassigned.','danger')}${table(['Class','Time','Conflict'],review.conflicts.map(conflict=>[esc(conflict.title),esc(demoTimeLabel(conflict.start)+'–'+demoTimeLabel(conflict.end)),esc(conflict.resource)]))}`;
 if(after){
  body+=`<div class="ca-review" aria-live="polite">${details([['Current coach',esc(caCoachLabel(before.coach))],['After saving',esc(caCoachLabel(after.coach))]])}`;
  if(after.coach&&review.ok)body+='<p class="hl-small hl-muted">No new scheduling conflicts. Confirm this coach can teach before saving.</p>';
  if(!after.coach)body+='<p class="hl-small hl-muted">Members will see “Coach to be confirmed.”</p>';
  const booked=review.notificationBookedCount||0,waitlist=review.notificationWaitlistCount||0;
  if(booked+waitlist)body+=notice('Notify members',`Saving queues a coach-change notice for ${booked} ${booked===1?'booking':'bookings'}${waitlist?' and '+waitlist+' '+(waitlist===1?'waitlist entry':'waitlist entries'):''}. No messages are sent in this preview.`,'warning');
  else if(review.stateChanged&&before.coach===after.coach)body+='<p class="hl-small hl-muted">The published coach stays the same. No member notice is needed.</p>';
  body+='</div>';
 }
 body+='<p class="hl-small hl-muted">Bookings, capacity and attendance records stay unchanged.</p></div>';
 return body;
}
function caFooter(){
 const state=coachAssignmentState,review=state.review;
 return act('Cancel','class-coach-cancel')+act('Save coach','class-coach-save','primary',!review.ok||!review.stateChanged||state.saving?'disabled':'');
}
function caRender(initial=false){
 const state=coachAssignmentState;if(!state)return;

 const focusId=overlay.contains(document.activeElement)?document.activeElement.id:null;
 overlay.querySelector('#hl-dialog-title').textContent=title;

function coachAssignmentOpen(id,date){

function caSave(){

const cePrograms={muay:'Muay Thai',padwork:'Padwork',hiit:'HIIT / Hyrox',bjj:'Jiu-jitsu',tkd:'Taekwondo'};

 if(scope==='occurrence'){draft.repeat='once';draft.endDate=date;draft.coachAssignmentMode=source?.coachAssignmentMode||'inherit';draft.defaultCoach=source?.defaultCoach??source?.coach??'';}
 if(draft.repeat==='once')draft.endDate=draft.startDate;

}
function ceBaseline(context){
 const source=context.id?(context.scope==='future'?csSeries(context.id,context.date):csOccurrence(context.id,context.date)):null;
 return ceDraft(source,context.date,context.id?context.scope:null);

function classEditorDirty(){return !!classEditorState&&!classEditorState.finished&&ceFingerprint(classEditorState.draft)!==ceFingerprint(classEditorState.baseline);}
function classEditorReset(){classEditorState=null;}
function classEditorOpen(id,date){

 const context={id:id||null,date,scope:id?'occurrence':'future'},draft=ceBaseline(context);

}
function classEditorRequestLeave(page,options={}){
 if(!classEditorDirty()){classEditorReset();return false;}
 classEditorState.exit={page,options};
 showDialog('Discard class changes?','<p>Your class changes have not been saved.</p>',act('Keep editing','class-editor-stay')+act('Discard changes','class-editor-discard','danger'));
 return true;

function ceInput(name,type='text',attrs=''){

function ceSelect(name,options,attrs=''){

}

function ceFormHtml(){

function ceDisplay(key,value){
 if(key==='coach')return value||'Unassigned';
 if(key==='coachAssignmentMode')return {inherit:'Use default coach',assigned:'Assigned for this date',unassigned:'Leave unassigned'}[value]||'Use default coach';
 if(value===undefined||value===null||value==='')return '—';
 if(key==='program')return cePrograms[value]||value;
 if(key==='level')return Number(value)?'Advanced · approval required':'All levels / beginner';
 if(key==='start'||key==='end')return demoTimeLabel(String(value));
 if(key==='repeat')return {once:'Does not repeat',daily:'Every day',weekly:'Every week'}[value]||value;
 if(key==='weekdays')return value.map(day=>ceDays[day]).join(', ');
 if(key==='startDate'||key==='endDate')return ceDateLabel(value);
 return String(value);
}
function ceReviewRows(review){
 const labels={title:'Class name',program:'Program',coach:classEditorState.context.id&&classEditorState.context.scope==='occurrence'?'Coach':'Default coach',coachAssignmentMode:'Coach assignment',space:'Room',capacity:'Capacity',start:'Starts',end:'Ends',level:'Level',repeat:'Repeat',weekdays:'Repeat on',startDate:'Start date',endDate:'Repeat until'};
 const state=classEditorState,before=state.baseline,after=review.draft||state.draft,editing=!!state.context.id;
 return ceKeys.filter(key=>!(key==='coachAssignmentMode'&&(!editing||state.context.scope!=='occurrence'))&&!(key==='weekdays'&&after.repeat!=='weekly')&&!(key==='endDate'&&after.repeat==='once')&&(!editing||JSON.stringify(before[key])!==JSON.stringify(after[key]))).map(key=>editing?[esc(labels[key]),esc(ceDisplay(key,before[key])),esc(ceDisplay(key,after[key]))]:[esc(labels[key]),esc(ceDisplay(key,after[key]))]);
